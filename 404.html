<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>Página no encontrada | Jam Wolf</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#9A2B1E">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --bg:#FAF7F1; --ink:#1C1A16; --ink-soft:#6B655C;
    --accent:#9A2B1E; --accent-soft:#F3E4E0; --gold:#AD8A55;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
  }
  .box{max-width:440px;}
  .mark{width:64px;height:64px;margin:0 auto 28px;}
  .code{
    font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--gold);
    text-transform:uppercase;letter-spacing:.1em;margin:0 0 14px;
  }
  h1{
    font-family:'Fraunces',serif;font-weight:500;font-style:italic;font-size:26px;
    margin:0 0 16px;color:var(--accent);
  }
  p{font-size:15px;color:var(--ink-soft);line-height:1.7;margin:0 0 30px;}
  a.btn{
    display:inline-block;background:var(--accent);color:#fff;text-decoration:none;
    padding:13px 28px;border-radius:8px;font-weight:600;font-size:14.5px;
  }
</style>
</head>
<body>
<div class="box">
  <svg class="mark" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M50 12 L62 30 L58 30 L72 46 L64 46 L80 66 L66 62 L70 84 L52 70 L50 88 L48 70 L30 84 L34 62 L20 66 L36 46 L28 46 L42 30 L38 30 Z" fill="#9A2B1E"/>
    <circle cx="43" cy="42" r="2.4" fill="#FAF7F1"/>
    <circle cx="57" cy="42" r="2.4" fill="#FAF7F1"/>
  </svg>
  <p class="code">Error 404</p>
  <h1>Esta página se perdió, no tu historia.</h1>
  <p>El enlace que buscabas no existe o se ha movido. Vuelve al catálogo y sigue desde ahí.</p>
  <a class="btn" href="/">Volver al catálogo</a>
</div>
</body>
</html>
